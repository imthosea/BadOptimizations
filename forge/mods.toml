# (renamed by gradle)
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/imthosea/BadOptimizations/issues"
# forge 1.20.4- requires mod icon to be in root folder
